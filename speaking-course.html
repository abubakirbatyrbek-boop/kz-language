<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>零基础造句与口语｜中亚语言通</title>
<link rel="stylesheet" href="styles.css">
<style>
.speaking-page{padding-top:34px}
.speaking-hero{display:grid;grid-template-columns:1.4fr .8fr;gap:24px;align-items:stretch}
.speak-card{border:1px solid #dfe7e3;border-radius:22px;padding:24px;background:#fff;box-shadow:0 10px 30px rgba(20,55,43,.05)}
.speak-steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.speak-step-pill{font-size:12px;border:1px solid #dfe7e3;padding:6px 10px;border-radius:999px;color:#385449;background:#fafcfb}
.lesson-shell{max-width:920px;margin:26px auto 0}
.lesson-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:14px}
.lesson-progress{height:8px;background:#edf2ef;border-radius:999px;overflow:hidden;margin:8px 0 20px}
.lesson-progress i{display:block;height:100%;background:#0e4a37;border-radius:999px}
.ladder-card{border:1px solid #dfe7e3;border-radius:24px;background:#fff;padding:28px;min-height:260px}
.ladder-badge{display:inline-block;font-size:12px;color:#9b6a00;background:#fbf5e8;border-radius:999px;padding:5px 9px}
.ladder-cn{font-size:17px;color:#4c6672;margin:22px 0 8px}
.ladder-target{font-size:42px;line-height:1.25;font-weight:800;letter-spacing:-.02em;margin:0 0 16px}
.ladder-note{font-size:15px;line-height:1.7;color:#5d7069;margin-bottom:20px}
.speak-actions{display:flex;gap:10px;flex-wrap:wrap}
.audio-large{border:0;border-radius:14px;padding:12px 16px;background:#0e4a37;color:#fff;font-weight:700;cursor:pointer}
.ghost-btn{border:1px solid #d6e2dd;border-radius:14px;padding:12px 16px;background:#fff;color:#174b3a;font-weight:700;cursor:pointer}
.module-list{display:grid;gap:14px;margin-top:18px}
.v20-module{border:1px solid #dfe7e3;border-radius:20px;padding:18px;background:#fff}
.v20-module.locked{opacity:.64;background:#fbfcfb}
.v20-module.passed{border-color:#b9d9ce;background:#f8fcfa}
.v20-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.v20-kicker{font-size:12px;color:#9b6a00;font-weight:800;letter-spacing:.08em}
.v20-title{font-size:21px;font-weight:800;margin:4px 0 4px}
.v20-desc{color:#677771;font-size:13px}
.v20-status{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;background:#eef6f1;color:#18543c}
.v20-status.lock{background:#f1f2f1;color:#7d8781}
.v20-status.login{background:#fff7e9;color:#8b651e}
.v20-stats{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:#6b7a73}
.v20-bar{height:8px;background:#edf2ef;border-radius:999px;overflow:hidden;margin:8px 0 14px}
.v20-bar i{display:block;height:100%;background:#0e4a37;border-radius:999px}
.v20-lessons{display:grid;gap:8px;margin-top:10px}
.v20-lesson{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;border:1px solid #e3eae6;border-radius:14px;padding:11px 12px;background:#fff}
.v20-lesson.locked{opacity:.5}
.v20-lesson.done{border-color:#c0dacd;background:#fafdfb}
.v20-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eff5f1;color:#18543c;font-weight:800;font-size:12px}
.v20-lesson strong{display:block;font-size:14px}
.v20-lesson small{display:block;color:#7b8882;margin-top:3px;line-height:1.35}
.v20-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.v20-rule{margin-top:12px;padding:12px 14px;border-radius:14px;background:#f5f8f6;color:#51675e;font-size:13px;line-height:1.65}
.v20-test-card{border:1px solid #dfe7e3;border-radius:22px;background:#fff;padding:24px;box-shadow:0 10px 30px rgba(20,55,43,.05);margin-top:16px}
.v20-options{display:grid;gap:10px}
.v20-option{width:100%;text-align:left;border:1px solid #dce7e2;border-radius:14px;padding:14px 16px;background:#fff;color:#173b30;cursor:pointer}
.v20-option.correct{border-color:#6eb59a;background:#edf8f3}
.v20-option.wrong{border-color:#d89c9c;background:#fff2f2}
.v20-result{text-align:center;padding:34px 20px;border:1px solid #dfe7e3;border-radius:20px;background:#fff}
.v20-score{font-size:56px;font-weight:900;color:#123f2d}
.v20-note{color:#66736c;line-height:1.7}
.login-gate{max-width:760px;margin:18px auto;padding:34px 26px;border:1px solid #d8e1db;border-radius:22px;background:#fff;text-align:center}
.login-gate h2{margin:8px 0 12px}
.login-gate p{max-width:620px;margin:0 auto 18px;color:#66736c;line-height:1.75}
@media(max-width:800px){
  .speaking-hero{grid-template-columns:1fr}
  .v20-head{flex-direction:column}
  .v20-lesson{grid-template-columns:34px 1fr}
  .v20-lesson .v20-lesson-action{grid-column:2}
  .ladder-target{font-size:32px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">中</span>
      <span><strong>中亚语言通</strong><small>哈萨克语 · 俄语</small></span>
    </a>
    <nav>
      <a href="courses.html">课程</a>
      <a href="scenes.html">场景</a>
      <a href="government.html">国家机关</a>
      <a href="progress.html">我的学习</a>
      <a href="feedback.html">客服反馈</a>
    </nav>
    <div id="authNav" class="auth-nav"><a class="auth-link" href="auth.html">登录 / 注册</a></div>
  </div>
</header>

<main class="section speaking-page">
  <div class="container">
    <div id="courseChooser" class="speaking-hero"></div>
    <div id="courseContent" class="lesson-shell"></div>
  </div>
</main>

<footer class="footer">
  <div class="container footer-wrap">
    <span>中亚语言通</span><span>零基础造句与口语</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="speaking.js"></script>

<script>
(function(){
  'use strict';

  // V20: keep the original SPEAKING_COURSES data and all lesson content,
  // but take control of the page UI so modules/tests/login gates are visible.

  const V20 = { owned:false, observer:null, polling:null };

  function esc(v){
    return String(v ?? '').replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  function langNow(){
    const l = new URLSearchParams(location.search).get('lang');
    return (l==='kk'||l==='ru') ? l : null;
  }

  function course(){
    return window.SPEAKING_COURSES?.[langNow()] || null;
  }

  function allLessons(c){
    return c.modules.flatMap(m => m[2].map((x,i)=>({
      module:m[0], moduleTitle:m[1], index:i,
      title:x[0], zh:x[1], target:x[2], note:x[3],
      id:`${m[0]}-${i+1}`
    })));
  }

  function storageKey(lang,userId){
    return `v13_speaking_${lang}_${userId || 'guest'}`;
  }

  function readProgress(lang){
    try { return JSON.parse(localStorage.getItem(storageKey(lang, window.__speakingUser?.id)) || '{}'); }
    catch { return {}; }
  }

  function writeProgress(lang,p){
    localStorage.setItem(storageKey(lang, window.__speakingUser?.id), JSON.stringify(p));
  }

  function done(lang,id){
    return readProgress(lang)[`v13:speaking:${lang}:${id}`]?.status === 'done';
  }

  function testState(lang,no){
    return readProgress(lang)[`v14:speaking-test:${lang}:${no}`] || null;
  }

  function passed(lang,no){
    return testState(lang,no)?.status === 'passed';
  }

  function testScore(lang,no){
    return Number(testState(lang,no)?.score || 0);
  }

  function completed(lang,c,no){
    const m=c.modules.find(x=>x[0]===no);
    return !!m && m[2].length>0 && m[2].every((_,i)=>done(lang,`${no}-${i+1}`));
  }

  function unlocked(lang,c,mi){
    if(mi===0) return true;
    if(!window.__speakingUser) return false; // module 2+ always requires login
    return passed(lang,c.modules[mi-1][0]);
  }

  function login(){
    const next = location.pathname.split('/').pop() + location.search;
    location.href = `auth.html?mode=login&next=${encodeURIComponent(next)}`;
  }

  function speak(text,lang){
    if(window.speakTarget){ window.speakTarget(text,lang); return; }
    if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音朗读'); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=.84; speechSynthesis.speak(u);
  }

  async function syncUser(){
    // Prefer the session already initialized by speaking.js.
    if(window.__speakingUser) return window.__speakingUser;
    try{
      const client = window.__speakingSupabase || window.KZAuth?.getClient?.();
      if(!client) return null;
      const {data} = await client.auth.getSession();
      if(data?.session?.user){
        window.__speakingUser = data.session.user;
        window.__speakingSupabase = client;
        return window.__speakingUser;
      }
    }catch(e){ console.warn('V20 auth sync failed',e); }
    return null;
  }

  async function migrateGuestProgress(lang){
    // If the user completes module 1 as a guest and then registers/logs in,
    // retain those local records under the account.
    if(!window.__speakingUser) return;
    const guestKey=storageKey(lang,null);
    const acctKey=storageKey(lang,window.__speakingUser.id);
    try{
      const guest=JSON.parse(localStorage.getItem(guestKey)||'{}');
      const acct=JSON.parse(localStorage.getItem(acctKey)||'{}');
      let changed=false;
      for(const [k,v] of Object.entries(guest)){
        if(!acct[k]){acct[k]=v;changed=true;}
      }
      if(changed) localStorage.setItem(acctKey,JSON.stringify(acct));
    }catch(e){}
  }

  async function saveLesson(lang,id){
    if(window.saveSpeakingLesson){
      await window.saveSpeakingLesson(lang,id);
      return;
    }
    const p=readProgress(lang);
    const now=new Date().toISOString();
    p[`v13:speaking:${lang}:${id}`]={status:'done',score:100,updated_at:now};
    writeProgress(lang,p);
  }

  function renderTop(lang,c,all){
    const doneCount=all.filter(x=>done(lang,x.id)).length;
    const pct=Math.round(doneCount/all.length*100);
    document.getElementById('courseChooser').innerHTML=`
      <div class="speak-card">
        <span class="eyebrow">${c.flag} ${c.label} · 造句与口语</span>
        <h1>${esc(c.title)}</h1>
        <p class="page-lead">${esc(c.desc)}</p>
        <div class="speak-steps">
          <span class="speak-step-pill">词</span>
          <span class="speak-step-pill">短语</span>
          <span class="speak-step-pill">完整句</span>
          <span class="speak-step-pill">换词</span>
          <span class="speak-step-pill">提问 / 否定</span>
          <span class="speak-step-pill">自己说</span>
        </div>
        <div style="margin-top:18px">
          <strong>完成进度：${doneCount} / ${all.length}</strong>
          <strong style="float:right">${pct}%</strong>
          <div class="lesson-progress"><i style="width:${pct}%"></i></div>
        </div>
      </div>
      <div class="speak-card">
        <span class="eyebrow">学习规则</span>
        <h2>一个模块学完，再考试过关。</h2>
        <p>每个模块必须完成全部小课，再参加模块考试；答对 <strong>70% 以上</strong>才进入下一模块。</p>
        <p class="speak-footer-note">${window.__speakingUser ? '已登录：进度与考试成绩会绑定到账号。' : '游客可体验第 1 模块；第 2 模块起需要注册 / 登录。'}</p>
      </div>`;
  }

  function renderPage(lang,c){
    const all=allLessons(c);
    renderTop(lang,c,all);
    const content=document.getElementById('courseContent');
    content.innerHTML=`
      <div id="v20Modules" class="module-list"></div>
      <div id="v20Active"></div>`;
    const root=document.getElementById('v20Modules');

    c.modules.forEach((m,mi)=>{
      const no=m[0], title=m[1];
      const ls=all.filter(x=>x.module===no);
      const d=ls.filter(x=>done(lang,x.id)).length;
      const isUnlocked=unlocked(lang,c,mi);
      const isComplete=d===ls.length;
      const isPassed=passed(lang,no);
      const sc=testScore(lang,no);

      let status = isPassed
        ? `<span class="v20-status">✓ 已通过 ${sc}%</span>`
        : (!isUnlocked && mi>=1 && !window.__speakingUser
            ? `<span class="v20-status login">🔐 第 2 模块起需登录</span>`
            : (!isUnlocked
                ? `<span class="v20-status lock">🔒 等待上一模块 70% 考试</span>`
                : (isComplete
                    ? `<span class="v20-status">✓ 小课已完成，等待考试</span>`
                    : `<span class="v20-status">学习中</span>`)));

      const card=document.createElement('section');
      card.className=`v20-module ${!isUnlocked?'locked':''} ${isPassed?'passed':''}`;
      card.dataset.v20='module';
      card.innerHTML=`
        <div class="v20-head">
          <div>
            <div class="v20-kicker">MODULE ${no}</div>
            <div class="v20-title">${esc(title)}</div>
            <div class="v20-desc">${mi===0?'完成全部小课后参加模块考试。':'通过上一模块考试（≥70%）后解锁。'}</div>
          </div>
          ${status}
        </div>
        <div class="v20-stats"><span>小课完成：${d} / ${ls.length}</span><span>${Math.round(d/ls.length*100)}%</span></div>
        <div class="v20-bar"><i style="width:${Math.round(d/ls.length*100)}%"></i></div>
        <div class="v20-lessons">
          ${ls.map((l,li)=>{
            const ld=done(lang,l.id);
            const lu=isUnlocked && (li===0 || ls.slice(0,li).every(x=>done(lang,x.id)));
            return `<div class="v20-lesson ${ld?'done':''} ${(!lu && !ld)?'locked':''}" data-id="${esc(l.id)}" data-mi="${mi}" data-li="${li}">
              <div class="v20-num">${ld?'✓':String(li+1).padStart(2,'0')}</div>
              <div><strong>${esc(l.title)}</strong><small>${esc(l.target)}</small></div>
              <div class="v20-lesson-action">${ld?'已完成 ✓':(lu?'开始 →':'🔒')}</div>
            </div>`;
          }).join('')}
        </div>
        <div class="v20-rule">${
          isPassed ? `模块考试：${sc}% · 已通过，可以继续或复习。`
          : isComplete && isUnlocked ? `本模块已经全部完成。现在进行模块考试，答对 ≥70% 才能继续。`
          : (!isUnlocked && mi>=1 && !window.__speakingUser) ? `第 2 模块开始需要注册 / 登录；登录后会保存学习进度与考试成绩。`
          : (!isUnlocked && mi>=1) ? `先通过上一模块考试（≥70%）。`
          : `按顺序完成小课：上一课完成后才开放下一课。`
        }</div>
        <div class="v20-actions"></div>`;

      const actions=card.querySelector('.v20-actions');
      if(!isUnlocked){
        if(mi>=1 && !window.__speakingUser){
          actions.innerHTML=`<button class="audio-large v20-login">🔐 注册 / 登录后继续</button>`;
          actions.querySelector('.v20-login').onclick=login;
        }else{
          actions.innerHTML=`<button class="ghost-btn" disabled>🔒 等待上一模块通过</button>`;
        }
      }else if(isComplete && !isPassed){
        actions.innerHTML=`<button class="audio-large v20-test">参加模块考试 →</button>`;
        actions.querySelector('.v20-test').onclick=()=>runTest(lang,c,all,mi);
      }else if(isPassed){
        actions.innerHTML=`<button class="ghost-btn v20-review">复习本模块 →</button>`;
        actions.querySelector('.v20-review').onclick=()=>openFirstAvailableLesson(lang,c,all,mi);
      }

      card.querySelectorAll('.v20-lesson').forEach(row=>{
        row.addEventListener('click',()=>{
          const li=Number(row.dataset.li);
          const locked=!isUnlocked || !(li===0 || ls.slice(0,li).every(x=>done(lang,x.id)));
          if(locked){
            if(mi>=1 && !window.__speakingUser) login();
            return;
          }
          openLesson(lang,c,all,mi,li);
        });
      });

      root.appendChild(card);
    });

    const first=firstAvailableModule(lang,c);
    if(first>=0) openFirstAvailableLesson(lang,c,all,first);
    V20.owned=true;
  }

  function firstAvailableModule(lang,c){
    for(let mi=0;mi<c.modules.length;mi++){
      if(!unlocked(lang,c,mi)) return mi;
      const no=c.modules[mi][0];
      if(!completed(lang,c,no) || !passed(lang,no)) return mi;
    }
    return c.modules.length-1;
  }

  function openFirstAvailableLesson(lang,c,all,mi){
    const no=c.modules[mi][0], ls=all.filter(x=>x.module===no);
    if(mi>=1 && !window.__speakingUser){ showLoginGate(); return; }
    if(!unlocked(lang,c,mi)){ return; }
    const li=ls.findIndex(x=>!done(lang,x.id));
    if(li>=0) openLesson(lang,c,all,mi,li);
  }

  function openLesson(lang,c,all,mi,li){
    const active=document.getElementById('v20Active');
    const m=c.modules[mi], ls=all.filter(x=>x.module===m[0]), l=ls[li];
    active.innerHTML=`
      <div class="ladder-card">
        <div class="lesson-top">
          <div><span class="eyebrow">第 ${m[0]} 模块 · ${esc(m[1])}</span><h2 style="margin:6px 0 0">${esc(l.title)}</h2></div>
          <span>小课 ${li+1} / ${ls.length}</span>
        </div>
        <div class="lesson-progress"><i style="width:${Math.round((li+1)/ls.length*100)}%"></i></div>
        <span class="ladder-badge">${li===0?'先认识':'往上加一层'}</span>
        <div class="ladder-cn">${esc(l.zh)}</div>
        <div class="ladder-target" lang="${lang==='kk'?'kk':'ru'}">${esc(l.target)}</div>
        <div class="speak-actions">
          <button class="audio-large" id="v20Play">🔊 听${c.label}</button>
          <button class="ghost-btn" id="v20Done">${done(lang,l.id)?'已完成':'记住了，下一课 →'}</button>
        </div>
        <p class="ladder-note">${esc(l.note||'先听发音，再跟读，然后自己说一遍。')}</p>
        <div class="challenge">
          <div class="challenge-row">
            <div><span class="eyebrow">自己说</span><div class="challenge-target">${esc(l.title)}</div></div>
            <button class="ghost-btn" id="v20Answer">看参考答案</button>
          </div>
          <div id="v20AnswerBox" class="hidden-answer" style="display:none">
            <strong lang="${lang==='kk'?'kk':'ru'}">${esc(l.target)}</strong>
            <button class="ghost-btn" id="v20Play2" style="padding:7px 10px">🔊</button>
          </div>
        </div>
      </div>`;
    active.querySelector('#v20Play').onclick=()=>speak(l.target,c.language);
    active.querySelector('#v20Answer').onclick=()=>{active.querySelector('#v20AnswerBox').style.display='block';};
    active.querySelector('#v20Play2').onclick=()=>speak(l.target,c.language);
    active.querySelector('#v20Done').onclick=async()=>{
      await saveLesson(lang,l.id);
      // Re-render so progress and next-module gate are visible immediately.
      renderPage(lang,c);
      setTimeout(()=>{
        const currentModuleCompleted=completed(lang,c,m[0]);
        if(currentModuleCompleted && !passed(lang,m[0])){
          const box=document.getElementById('v20Active');
          if(box) {
            box.innerHTML=`
              <div class="v20-test-card">
                <span class="eyebrow">模块考试</span>
                <h2>第 ${m[0]} 模块：${esc(m[1])}</h2>
                <p class="v20-note">你已经完成本模块全部小课。答对 <strong>70% 以上</strong>才能进入下一个模块。</p>
                <button class="audio-large" id="v20ImmediateTest">参加模块考试 →</button>
              </div>`;
            box.querySelector('#v20ImmediateTest').onclick=()=>runTest(lang,c,all,mi);
          }
        }
      },20);
    };
    active.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function showLoginGate(){
    const box=document.getElementById('v20Active');
    if(!box)return;
    box.innerHTML=`
      <div class="login-gate">
        <span class="eyebrow">第 2 模块起需要账号</span>
        <h2>注册 / 登录后继续</h2>
        <p>第 1 模块可以先免费体验。进入第 2 模块以后，需要注册 / 登录；学习进度与模块考试成绩会保存到你的账号，之后重新打开网站还能继续。</p>
        <button class="audio-large" id="v20GateLogin">🔐 注册 / 登录</button>
      </div>`;
    box.querySelector('#v20GateLogin').onclick=login;
    box.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function buildQuestions(lang,c,mi){
    const ls=allLessons(c).filter(x=>x.module===c.modules[mi][0]);
    const pool=ls.slice(0,Math.min(10,ls.length));
    return pool.map((l,i)=>{
      const opts = i%2===0
        ? [l.target,...pool.filter(x=>x.id!==l.id).slice(0,3).map(x=>x.target)]
        : [l.zh,...pool.filter(x=>x.id!==l.id).slice(0,3).map(x=>x.zh)];
      const shuffled=opts.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
      return i%2===0
        ? {kind:'target',question:l.zh,answer:l.target,options:shuffled,source:l.target}
        : {kind:'meaning',question:l.target,answer:l.zh,options:shuffled,source:l.target};
    });
  }

  async function saveTest(lang,no,pct,ok,answers){
    const p=readProgress(lang);
    p[`v14:speaking-test:${lang}:${no}`]={status:ok?'passed':'failed',score:pct,updated_at:new Date().toISOString(),answers};
    writeProgress(lang,p);
    const s=window.__speakingSupabase, u=window.__speakingUser;
    if(s&&u){
      try{
        await s.from('test_results').insert({
          user_id:u.id,node_id:`v14:speaking-test:${lang}:${no}`,language:lang,score:pct,passed:ok,answers
        });
      }catch(e){console.warn('V20 test save failed',e);}
    }
  }

  function runTest(lang,c,all,mi){
    if(mi>=1 && !window.__speakingUser){showLoginGate();return;}
    const no=c.modules[mi][0];
    if(!completed(lang,c,no)){
      const box=document.getElementById('v20Active');
      if(box) box.innerHTML=`<div class="v20-test-card"><h2>还不能考试</h2><p class="v20-note">请先完成本模块全部小课。</p></div>`;
      return;
    }
    const qs=buildQuestions(lang,c,mi);
    const box=document.getElementById('v20Active');
    if(!box)return;
    const state={i:0,correct:0,answers:[]};

    const draw=()=>{
      const q=qs[state.i];
      box.innerHTML=`
        <div class="v20-test-card">
          <div class="lesson-top">
            <div><span class="eyebrow">第 ${no} 模块考试</span><h2>答对 70% 才能进入下一模块</h2></div>
            <span>${state.i+1} / ${qs.length}</span>
          </div>
          <div class="lesson-progress"><i style="width:${Math.round((state.i+1)/qs.length*100)}%"></i></div>
          <div class="test-prompt">
            <span class="eyebrow">${q.kind==='target'?'请选择正确的目标语言':'这句话是什么意思？'}</span>
            <h3 lang="${q.kind==='meaning'?(lang==='kk'?'kk':'ru'):''}">${esc(q.question)}</h3>
            <button class="ghost-btn" id="v20QAudio">🔊 听${c.label}</button>
          </div>
          <div class="v20-options">
            ${q.options.map((o,i)=>`<button class="v20-option" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}
          </div>
          <div id="v20QFeedback" class="module-feedback" style="margin-top:12px;min-height:24px"></div>
          <div class="speak-actions" style="margin-top:14px"><button class="ghost-btn" id="v20Next" disabled>下一题 →</button></div>
          <p class="v20-note">答对 ≥70% 即通过；未通过可以重新学习、重新测试。</p>
        </div>`;

      box.querySelector('#v20QAudio').onclick=()=>speak(q.source,c.language);
      let answered=false;
      box.querySelectorAll('.v20-option').forEach(btn=>{
        btn.onclick=()=>{
          if(answered)return;
          answered=true;
          const value=q.options[Number(btn.dataset.i)], ok=value===q.answer;
          box.querySelectorAll('.v20-option').forEach(x=>{
            x.disabled=true;
            if(q.options[Number(x.dataset.i)]===q.answer)x.classList.add('correct');
          });
          if(ok){state.correct++;btn.classList.add('correct');box.querySelector('#v20QFeedback').textContent='回答正确！';}
          else {btn.classList.add('wrong');box.querySelector('#v20QFeedback').textContent=`回答错误，正确答案：${q.answer}`;}
          state.answers.push({question:q.question,selected:value,correct:ok});
          box.querySelector('#v20Next').disabled=false;
        };
      });
      box.querySelector('#v20Next').onclick=async()=>{
        if(!answered)return;
        if(state.i<qs.length-1){state.i++;draw();return;}
        const pct=Math.round(state.correct/qs.length*100), ok=pct>=70;
        await saveTest(lang,no,pct,ok,state.answers);
        if(ok){
          renderPage(lang,c);
          const active=document.getElementById('v20Active');
          if(mi<c.modules.length-1 && !window.__speakingUser){
            showLoginGate();
          }else if(mi<c.modules.length-1){
            active.innerHTML=`<div class="v20-test-card"><div class="v20-result"><span class="eyebrow">模块通过</span><div class="v20-score">${pct}%</div><p class="v20-note">恭喜，下一模块已经解锁。</p><button class="audio-large" id="v20NextM">进入下一模块 →</button></div></div>`;
            active.querySelector('#v20NextM').onclick=()=>openFirstAvailableLesson(lang,c,all,mi+1);
          }
        }else{
          box.innerHTML=`<div class="v20-test-card"><div class="v20-result"><span class="eyebrow">需要再练一次</span><div class="v20-score">${pct}%</div><p class="v20-note">本次没有达到 70%。回去复习本模块后可以重新测试。</p><button class="audio-large" id="v20Retry">重新测试 →</button></div></div>`;
          box.querySelector('#v20Retry').onclick=()=>runTest(lang,c,all,mi);
        }
      };
    };
    draw();
    box.scrollIntoView({behavior:'smooth',block:'start'});
  }

  async function boot(){
    const lang=langNow();
    if(!lang)return;
    await syncUser();
    await migrateGuestProgress(lang);
    const c=course();
    if(!c)return;

    // Take control after speaking.js has finished its own initial render.
    // Also observe external rewrites so the old renderer cannot replace V20.
    renderPage(lang,c);

    if(V20.observer) V20.observer.disconnect();
    V20.observer = new MutationObserver(()=>{
      const chooser=document.getElementById('courseChooser');
      const content=document.getElementById('courseContent');
      if(!chooser || !content)return;
      if(chooser.dataset.v20Owned==='1')return;
      clearTimeout(V20._rerenderTimer);
      V20._rerenderTimer=setTimeout(()=>{
        if(langNow()===lang) renderPage(lang,c);
      },80);
    });
    const chooser=document.getElementById('courseChooser');
    const content=document.getElementById('courseContent');
    if(chooser && content){
      chooser.dataset.v20Owned='1';
      V20.observer.observe(chooser,{childList:true,subtree:false});
      V20.observer.observe(content,{childList:true,subtree:false});
    }
  }

  const start=Date.now();
  function poll(){
    if(V20.owned)return;
    if(window.SPEAKING_COURSES && document.getElementById('courseChooser')){
      boot().catch(e=>console.warn('V20 boot failed',e));
      V20.polling=setTimeout(()=>{
        // If auth init or the old renderer replaced our DOM, take control again.
        V20.owned=false;
        poll();
      },1200);
      return;
    }
    if(Date.now()-start<8000) V20.polling=setTimeout(poll,250);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',poll,{once:true});
  else poll();

})();
</script>
