function govSpeak(text,lang){ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=.84; speechSynthesis.speak(u); }
function renderGov(){
 const list=document.getElementById('govList'), search=document.getElementById('govSearch'), cat=document.getElementById('govCategory');
 function draw(){
  const q=(search.value||'').trim().toLowerCase(), c=cat.value;
  const rows=GOV_DATA.filter(x=>(c==='all'||x.c===c)&&(!q||[x.cn,x.kk,x.ru].some(v=>v.toLowerCase().includes(q))));
  list.innerHTML=rows.map(x=>`<article class="government-card"><div class="gov-cn"><span class="eyebrow">${({ministry:'中央部委',agency:'国家机构与监管部门',law:'司法、执法与安全机构',local:'地方行政机关'})[x.c]}</span><h3>${x.cn}</h3></div><div class="gov-lang"><div><span>Қазақша</span><strong>${x.kk}</strong><button class="gov-audio" type="button" data-t="${x.kk.replace(/"/g,'&quot;')}" data-l="kk-KZ">🔊 听哈语</button></div><div><span>Русский</span><strong>${x.ru}</strong><button class="gov-audio" type="button" data-t="${x.ru.replace(/"/g,'&quot;')}" data-l="ru-RU">🔊 听俄语</button></div></div></article>`).join('') || '<div class="government-empty">没有找到匹配的机构名称。</div>';
 }
 draw(); search.addEventListener('input',draw); cat.addEventListener('change',draw); list.addEventListener('click',e=>{const b=e.target.closest('.gov-audio');if(!b)return;govSpeak(b.dataset.t,b.dataset.l);});
}
document.addEventListener('DOMContentLoaded',renderGov);
